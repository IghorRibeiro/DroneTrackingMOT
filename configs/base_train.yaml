# Base detector (best.pt): YOLO26n fine-tuned from the COCO-pretrained checkpoint on the training split
# (170 sequences, stride 4, 32,330 images). Values are the arguments recorded inside the released checkpoint
# (train_args of best.pt); the original run used a single NVIDIA Tesla T4 (device 0).
model: yolo26n.pt
data: configs/data.yaml            # see src/data/split_train_val.py
epochs: 50
patience: 15                       # early stopping; the best epoch was 10
batch: 32
imgsz: 640
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
mosaic: 0.3
close_mosaic: 10
seed: 0
deterministic: true
amp: true
workers: 8
cache: disk
